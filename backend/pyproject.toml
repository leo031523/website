[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "UP007",  # Use X | Y for union (conflicts with older runtime compat)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
